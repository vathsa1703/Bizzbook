databases:
  - name: bizbook-db
    plan: free
    databaseName: bizbook
    user: bizbook

services:
  - type: web
    name: bizbook
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: CHAT_MODEL
        value: llama-3.3-70b-versatile
      - key: WHISPER_MODEL
        value: whisper-large-v3
      - key: DATABASE_URL
        fromDatabase:
          name: bizbook-db
          property: connectionString

# The frontend install uses --include=dev deliberately: NODE_ENV=production (set below)
# is applied by Render during the build phase too, and npm omits devDependencies by
# default when NODE_ENV=production. vite/@vitejs/plugin-react/tailwindcss/postcss/
# autoprefixer are (correctly) devDependencies in frontend/package.json since they're
# build-time-only tools — without --include=dev, `vite` never gets installed and
# `npm run build` fails with "vite: not found". The backend install does NOT need this
# flag: its only devDependency (nodemon) is dev-server tooling, not needed to run
# `node src/server.js`.
#
# PORT is injected automatically by Render for web services; the app already reads
# process.env.PORT, so it does not need to be declared here.
#
# DB_PATH is intentionally NOT set here. It defaults to backend/data/business.db inside
# the service's own filesystem, which works fine on the free plan for demo/testing. If
# you later add a Render persistent disk (paid plan required), mount it and set DB_PATH
# to a path on that disk — no code change needed, see backend/src/config/db.js.
#
# `databases: bizbook-db` above provisions a free Render Postgres instance and wires its
# connection string into DATABASE_URL automatically on blueprint sync. It's declared here
# ahead of the actual code cutover (see docs/postgres-migration-checklist.md) so the
# instance exists and is reachable before the app's data layer is switched over --
# DATABASE_URL is inert until backend/src/config/dbEngine.js (or equivalent) is wired in
# as the live path. Render's free Postgres plan expires 30 days after creation and does
# not auto-renew -- fine for finishing this migration, not for a production cutover;
# upgrade the `plan:` under `databases:` before relying on it long-term.
