databases:
  # Retained to avoid deleting or mutating an existing Render resource during
  # Blueprint synchronization. The BizBook service below does not use this DB.
  - name: orudina-db
    plan: free
    databaseName: orudina
    user: orudina

services:
  - type: web
    name: orudina
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: CHAT_MODEL
        value: openai/gpt-oss-120b
      - key: WHISPER_MODEL
        value: whisper-large-v3
      # Set this to the NEW BizBook PostgreSQL connection string in Render.
      # Keep the value out of this repository and do not link the legacy DB.
      - key: DATABASE_URL
        sync: false
